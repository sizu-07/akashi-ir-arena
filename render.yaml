services:
  - type: web
    name: akashi-ticket-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.ticket
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_ORIGIN
        sync: false
      - key: TICKET_OPERATOR_PASSWORD
        sync: false
      - key: TICKET_GAME_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
