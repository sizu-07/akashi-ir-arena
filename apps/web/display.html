<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>明石光線 | 投影</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body class="display">
    <button id="prepare">表示を準備 / 全画面・音声を有効化</button>

    <main>
      <small>AKASHI / IR ARENA — 2 VS 2</small>
      <div class="match">
        <h1 id="phase">接続待ち</h1>
        <strong id="clock">05:00</strong>
        <div id="score">A 0 : 0 B</div>
      </div>
      <div id="players" class="players"></div>
    </main>

    <div id="overlay" hidden>
      <h2 id="overlayTitle"></h2>
      <p id="overlayText"></p>
    </div>

    <video id="video" src="/rules.mp4" preload="none" hidden playsinline></video>

    <details id="pair">
      <summary>タブレット接続QR</summary>
      <img id="qr" src="/api/pair.svg" alt="タブレット接続QR">
      <p>運営PINが別途必要です</p>
    </details>

    <div id="status">表示未準備</div>

    <script src="/display.js" type="module"></script>
  </body>
</html>
