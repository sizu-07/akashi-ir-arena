[env:xiao_s3_plus]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
; Plus has 16MB flash. The shared XIAO S3 variant supplies USB CDC and OPI PSRAM.
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@6.21.5
build_flags = -DCORE_DEBUG_LEVEL=0
monitor_filters = esp32_exception_decoder

; Existing assembled 4E board. Uses the same game protocol, with its real
; input/output pins and the measured working GPIO42 LED data connection.
[env:legacy_4e_game]
extends = env:xiao_s3_plus
build_flags = -DCORE_DEBUG_LEVEL=0 -DLEGACY_4E_GAME=1

; Real game MQTT, clock sync, start ACK and hit_candidate; GPIO44 receiver only.
[env:receiver_only_game]
extends = env:xiao_s3_plus
build_flags = -DCORE_DEBUG_LEVEL=0 -DGAME_RECEIVER_ONLY=1

; Complete assembled 4E game guns. Device credentials are provisioned over USB.
[env:player1_game]
extends = env:legacy_4e_game
build_flags = ${env:legacy_4e_game.build_flags} -DGAME_PLAYER=1

[env:player2_game]
extends = env:legacy_4e_game
build_flags = ${env:legacy_4e_game.build_flags} -DGAME_PLAYER=2

[env:player3_game]
extends = env:legacy_4e_game
build_flags = ${env:legacy_4e_game.build_flags} -DGAME_PLAYER=3

[env:player4_game]
extends = env:legacy_4e_game
build_flags = ${env:legacy_4e_game.build_flags} -DGAME_PLAYER=4
